name: publish-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PACKAGE: evtx2es
  JSON_COMMAND: evtx2json
  PYTHON_VERSION: '3.13'
  NUITKA_EXTRA_ARGS: ''
  PYTHON_CPU_COUNT: '2'
  PYTHONUTF8: '1'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.release_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Validate release version
        id: release_version
        run: |
          version=$(uv run --locked python -c "from importlib.metadata import version; print(version('$PACKAGE'))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: uv run --locked pytest

      - name: Verify Python commands
        run: |
          uv run --locked "$PACKAGE" --help
          uv run --locked "$PACKAGE" --version
          uv run --locked "$JSON_COMMAND" --help
          uv run --locked "$JSON_COMMAND" --version

      - name: Prepare native validation
        run: uv run --locked python .github/binary_smoke.py prepare

      - name: Collect runtime licenses
        run: uv run --locked python .github/collect_runtime_licenses.py dist/LICENSES.txt

      - name: Build binaries
        run: uv run --locked python .github/build_binaries.py

      - name: Verify binaries
        run: uv run --locked python .github/binary_smoke.py verify

      - name: Upload binary validation logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: binary-validation-windows
          path: dist/validation/
          if-no-files-found: ignore
          retention-days: 7

      - name: Bundle release assets
        run: |
          bundle="dist/$PACKAGE-windows-x64-v${{ steps.release_version.outputs.version }}"
          mkdir -p "$bundle"
          mv "dist/$PACKAGE.exe" "$bundle/$PACKAGE.exe"
          mv "dist/$JSON_COMMAND.exe" "$bundle/$JSON_COMMAND.exe"
          cp dist/LICENSES.txt "$bundle/LICENSES.txt"
          uv run --locked python -c "import shutil; shutil.make_archive(r'$bundle', 'zip', root_dir=r'$bundle')"

      - name: Create release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: v${{ steps.release_version.outputs.version }}
          files: dist/${{ env.PACKAGE }}-windows-x64-v${{ steps.release_version.outputs.version }}.zip
          name: Release v${{ steps.release_version.outputs.version }}
          body: 'This release was automatically created by GitHub Actions.'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: build-windows
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run --locked pytest

      - name: Verify Python commands
        run: |
          uv run --locked "$PACKAGE" --help
          uv run --locked "$PACKAGE" --version
          uv run --locked "$JSON_COMMAND" --help
          uv run --locked "$JSON_COMMAND" --version

      - name: Prepare native validation
        run: uv run --locked python .github/binary_smoke.py prepare

      - name: Collect runtime licenses
        run: uv run --locked python .github/collect_runtime_licenses.py dist/LICENSES.txt

      - name: Build binaries
        run: uv run --locked python .github/build_binaries.py

      - name: Verify binaries
        run: uv run --locked python .github/binary_smoke.py verify

      - name: Upload binary validation logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: binary-validation-linux
          path: dist/validation/
          if-no-files-found: ignore
          retention-days: 7

      - name: Bundle release assets
        run: |
          bundle="dist/$PACKAGE-linux-x64-v${{ needs.build-windows.outputs.version }}"
          mkdir -p "$bundle"
          mv "dist/$PACKAGE" "$bundle/$PACKAGE"
          mv "dist/$JSON_COMMAND" "$bundle/$JSON_COMMAND"
          cp dist/LICENSES.txt "$bundle/LICENSES.txt"
          uv run --locked python -c "import shutil; shutil.make_archive(r'$bundle', 'zip', root_dir=r'$bundle')"

      - name: Upload asset to release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: v${{ needs.build-windows.outputs.version }}
          files: dist/${{ env.PACKAGE }}-linux-x64-v${{ needs.build-windows.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
