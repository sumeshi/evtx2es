name: publish-binary-pypi

on:
  push:
    branches:
      - master

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Python
      uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: '3.13'

    - name: Build and publish
      run: |
        uv build
        uv publish --token ${{secrets.PYPI_TOKEN}}

