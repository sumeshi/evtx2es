name: pytest

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  pytest:
    name: Run tests
    runs-on: ${{ matrix.os }}
    env:
      PYTHON_CPU_COUNT: '2'
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run --locked pytest --junitxml=reports/pytest.xml
      - name: Report pytest failures
        if: always()
        continue-on-error: true
        run: uv run --no-sync python .github/report_pytest.py reports/pytest.xml
      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-${{ runner.os }}-python-${{ matrix.python-version }}
          path: reports/pytest.xml
          if-no-files-found: ignore
          retention-days: 7
